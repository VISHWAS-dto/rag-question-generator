[project]
name = "rag-due-diligence"
version = "1.0.0"
description = "Investor due-diligence question generator, interview engine, and report engine, built on a loosely coupled RAG + self-hosted LLM architecture."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }

# --- Core dependencies: shared by the `app` and `rag` services ---
# The RAG runtime (rag_service.*) is importable in-process by the `app`
# service when APP_RAG_MODE=in_process (the local/single-node default), so
# every package rag_service imports at runtime must be a core dependency,
# not an optional extra. The `rag` extra below is retained for the
# standalone rag-service image build.
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "httpx>=0.27,<0.29",
    "structlog>=24.4,<25",
    "tenacity>=9.0,<10",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14,<2",
    # --- RAG runtime (embeddings + vector store + retrieval + ingestion) ---
    "chromadb>=0.5.23",
    "sentence-transformers>=3.4.1",
    "langchain-text-splitters>=0.3,<0.4",
    "beautifulsoup4>=4.12,<5",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
# The `app` service: API, orchestration, persistence, HTTP clients.
app = [
    "psycopg[binary]>=3.2,<4",
]

# The `rag` service: embeddings + vector store + retrieval + ingestion.
rag = [
    "langchain-text-splitters>=0.3,<0.4",
    "langchain-core>=0.3,<0.4",
    "chromadb>=0.5.20,<0.6",
    "sentence-transformers>=3.3,<4",
    "beautifulsoup4>=4.12,<5",
    "requests>=2.32,<3",
]

dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=6.0,<7",
    "ruff>=0.8,<0.9",
    "mypy>=1.13,<2",
    "types-requests",
    "locust>=2.32,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "rag_service", "shared"]

[tool.uv]
package = true

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["app", "rag_service", "shared", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PTH", "RUF"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
# Telemetry env vars + logger levels must be set before `import chromadb`.
"rag_service/vectorstore.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
plugins = ["pydantic.mypy"]
mypy_path = "."
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = [
    "chromadb.*",
    "sentence_transformers.*",
    "langchain_text_splitters.*",
    "langchain_core.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: fast, no network, no external services",
    "integration: needs a running rag/llm/db service or the built vector index",
    "live: hits a real LLM endpoint (costs tokens); skipped unless RUN_LIVE_TESTS=1",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

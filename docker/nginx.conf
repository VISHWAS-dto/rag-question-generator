server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1m;

    # Runtime-rendered API base for the SPA (see frontend-entrypoint.sh).
    location = /config.js {
        add_header Content-Type application/javascript;
        alias /usr/share/nginx/html/config.js;
    }

    # Reverse-proxy the API so the browser uses a single origin (no CORS).
    location /api/ {
        proxy_pass http://app:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # POST /sessions runs a slow LLM call; give it room.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
